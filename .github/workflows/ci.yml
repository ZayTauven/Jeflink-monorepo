# Intégration continue. gitleaks sur tout l'historique (spec 001, S21), puis les tests et
# contrôles de l'API et des paquets TypeScript.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # tout l'historique : un secret retiré depuis reste un secret publié
      - name: gitleaks (image officielle, sans action tierce ni licence)
        run: >
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          git /repo --redact --no-banner --config /repo/.gitleaks.toml

  api:
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Image de l'API (GDAL, PROJ) et services
        run: docker compose -f infra/docker-compose.yml up -d --build db redis
      - name: Lint et format
        run: |
          docker compose -f infra/docker-compose.yml run --rm --no-deps api uv run ruff check .
          docker compose -f infra/docker-compose.yml run --rm --no-deps api uv run ruff format --check .
      - name: Migrations à jour
        run: >
          docker compose -f infra/docker-compose.yml run --rm api
          uv run python manage.py makemigrations --check --dry-run
      - name: Tests
        run: docker compose -f infra/docker-compose.yml run --rm api uv run pytest -q

  typescript:
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  edge:
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: En-têtes X-Jeflink-* retirés par le proxy
        run: node infra/proxy/check-headers.mjs
      - name: Gabarits de production et interne (nginx -t)
        run: node infra/proxy/validate-templates.mjs
      - name: Bord public (nginx + API en réglages de production), test de fumée
        run: node infra/proxy/run-smoke.mjs
