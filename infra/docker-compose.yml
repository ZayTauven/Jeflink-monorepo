name: jeflink

# Câblage de dev (non secret) déclaré ici ; les secrets vont dans apps/api/.env (optionnel en local).
x-api-env: &api-env
  DJANGO_SETTINGS_MODULE: jeflink.settings.local
  DJANGO_ENV: local
  # Clés de DÉVELOPPEMENT uniquement, publiques et sans valeur : jamais réutilisées ailleurs.
  SECRET_KEY: local-dev-only-secret-key-not-secret-000
  JWT_SIGNING_KEYS: dev1:local-dev-jwt-key-one-not-secret-1111111,dev2:local-dev-jwt-key-two-not-secret-2222222
  OTP_HMAC_KEY: local-dev-otp-hmac-key-not-secret-3333333
  MFA_ENCRYPTION_KEYS: bG9jYWwtZGV2LW1mYS1rZXktbm90LXNlY3JldC00NDQ=
  BFF_SHARED_SECRETS: local-dev-bff-secret-not-secret-5555555555
  PII_HMAC_KEY: local-dev-pii-hmac-key-not-secret-6666666
  REDIS_CACHE_URL: redis://redis:6379/1
  DATABASE_URL: postgis://jeflink:jeflink@db:5432/jeflink
  REDIS_URL: redis://redis:6379/0
  # Redis dédié à l'auth et aux limites (S7) : mot de passe, aucune éviction. Valeur de dev publique.
  RATELIMIT_REDIS_URL: redis://:local-dev-redis-auth-not-secret@redis-auth:6379/0
  # Dev : le BFF de `pnpm dev --filter web` tourne sur l'hôte et appelle http://localhost:8000.
  # Le secret BFF et le réseau de confiance restent exigés ; en production, seul « api ».
  INTERNAL_API_HOSTS: api,localhost
  # Stockage d'objets de dev (SeaweedFS, sans authentification) : identifiants factices et publics.
  # S3_ENDPOINT est l'hôte vu par l'API ; S3_PUBLIC_ENDPOINT, celui du navigateur (URL signées).
  S3_ENDPOINT: http://s3:8333
  S3_PUBLIC_ENDPOINT: http://localhost:8333
  S3_BUCKET: jeflink-dev
  S3_ACCESS_KEY: local-dev-s3-access-not-secret
  S3_SECRET_KEY: local-dev-s3-secret-not-secret
  TIME_ZONE: Africa/Dakar

x-api-env-file: &api-env-file
  - path: ../apps/api/.env
    required: false

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: jeflink
      POSTGRES_USER: jeflink
      POSTGRES_PASSWORD: jeflink
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeflink"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # Sessions actives, compteurs de limites, blocages (spec 001, S7 ; infra 2). Une éviction
  # rouvrirait des limites ou ferait revivre une session révoquée : noeviction, persistance AOF.
  redis-auth:
    image: redis:7-alpine
    command: >
      redis-server --requirepass local-dev-redis-auth-not-secret
      --maxmemory-policy noeviction --appendonly yes
    volumes: [redisauth:/data]

  # Stockage objets S3-compatible de dev (photos, audio, KYC). MinIO ne publie plus d'image Docker.
  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=8333
    ports: ["8333:8333"]
    volumes: [s3data:/data]

  api:
    build: ../apps/api
    user: "0:0" # dev : uv run sur le code monté ; l'image de production tourne sans privilèges
    command: uv run --frozen python manage.py runserver 0.0.0.0:8000
    environment: *api-env
    env_file: *api-env-file
    ports: ["8000:8000"]
    volumes: ["../apps/api:/app"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
      redis-auth: { condition: service_started }

  worker:
    build: ../apps/api
    user: "0:0" # dev : uv run sur le code monté ; l'image de production tourne sans privilèges
    command: uv run --frozen celery -A jeflink worker -l info
    environment: *api-env
    env_file: *api-env-file
    volumes: ["../apps/api:/app"]
    depends_on: [api]

  # Planificateur Celery (infra 3) : une seule instance, jamais embarqué dans les workers
  # (plusieurs workers -B lanceraient chaque tâche planifiée plusieurs fois).
  beat:
    build: ../apps/api
    user: "0:0" # dev : uv run sur le code monté ; l'image de production tourne sans privilèges
    command: uv run --frozen celery -A jeflink beat -l info --schedule /tmp/celerybeat-schedule
    environment: *api-env
    env_file: *api-env-file
    volumes: ["../apps/api:/app"]
    depends_on: [api]

volumes:
  pgdata:
  s3data:
  redisauth:
