openapi: 3.0.3
info:
  title: Jeflink API
  version: 0.1.0
  description: Contrat unique des fronts et apps Jeflink (client TS généré depuis
    ce schéma).
paths:
  /api/auth/config/:
    get:
      operationId: auth_config
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfig'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout
      tags:
      - auth
      responses:
        '204':
          description: No response body
  /api/auth/mfa/totp/confirm/:
    post:
      operationId: auth_mfa_totp_confirm
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCodeRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TotpCodeRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TotpCodeRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
          description: ''
        '400':
          description: mfa_invalid (+ attempts_remaining)
        '401':
          description: mfa_token_invalid
        '403':
          description: mfa_locked, mfa_enrollment_not_authorized
  /api/auth/mfa/totp/setup/:
    post:
      operationId: auth_mfa_totp_setup
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpSetupRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TotpSetupRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TotpSetupRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetupResponse'
          description: ''
        '400':
          description: mfa_invalid (+ attempts_remaining)
        '401':
          description: mfa_token_invalid
        '403':
          description: mfa_locked, mfa_enrollment_not_authorized
  /api/auth/mfa/totp/step-up/:
    post:
      operationId: auth_mfa_totp_step_up
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StepUpRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StepUpRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
        '400':
          description: mfa_invalid
        '403':
          description: ops_forbidden, mfa_locked
  /api/auth/mfa/totp/verify/:
    post:
      operationId: auth_mfa_totp_verify
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCodeRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TotpCodeRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TotpCodeRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
          description: ''
        '400':
          description: mfa_invalid (+ attempts_remaining)
        '401':
          description: mfa_token_invalid
        '403':
          description: mfa_locked, mfa_enrollment_not_authorized
  /api/auth/otp/request/:
    post:
      operationId: auth_otp_request
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: 'Une clé par saisie du numéro (16 à 64 caractères) : même clé,
          même réponse.'
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallengeResponse'
          description: ''
        '400':
          description: phone_invalid, phone_not_mobile, phone_region_not_supported
        '429':
          description: otp_rate_limited (+ retry_after)
        '503':
          description: otp_temporarily_unavailable
  /api/auth/otp/resend/:
    post:
      operationId: auth_otp_resend
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpResendRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpResendRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpResendRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallengeResponse'
          description: ''
  /api/auth/otp/verify/:
    post:
      operationId: auth_otp_verify
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
          description: ''
        '400':
          description: otp_invalid (+ attempts_remaining), otp_expired, otp_challenge_invalid,
            terms_not_accepted
        '403':
          description: account_disabled, account_not_allowed
        '409':
          description: otp_already_used
        '429':
          description: otp_locked
  /api/auth/phone-change/confirm/:
    post:
      operationId: auth_phone_change_confirm
      description: '« J''ai changé de numéro » : l''utilisateur saisit le code reçu
        sur le nouveau numéro.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneChangeConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PhoneChangeConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhoneChangeConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
          description: ''
        '400':
          description: otp_invalid, terms_not_accepted, phone_invalid
        '403':
          description: account_disabled
        '409':
          description: otp_already_used, phone_in_use
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '401':
          description: refresh_invalid, session_revoked
  /api/auth/token/revoke/:
    post:
      operationId: auth_token_revoke
      description: Déconnexion par le refresh, sans accès valide (BFF web, apps hors
        ligne longtemps).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequestRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/bookings/:
    get:
      operationId: bookings_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: La valeur du curseur de pagination.
        schema:
          type: string
      tags:
      - bookings
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClientBookingList'
          description: ''
        '401':
          description: not_authenticated
        '403':
          description: profile_incomplete, role_required, provider_not_verified
        '404':
          description: not_found
  /api/bookings/{public_id}/:
    get:
      operationId: bookings_retrieve
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - bookings
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientBooking'
          description: ''
        '401':
          description: not_authenticated
        '403':
          description: profile_incomplete, role_required, provider_not_verified
        '404':
          description: not_found
  /api/bookings/{public_id}/cancel/:
    post:
      operationId: bookings_cancel
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientBooking'
          description: ''
        '409':
          description: transition_not_allowed
        '422':
          description: reason_invalid, note_invalid
        '401':
          description: not_authenticated
        '403':
          description: profile_incomplete, role_required, provider_not_verified
        '404':
          description: not_found
  /api/bookings/{public_id}/no-show/:
    post:
      operationId: bookings_no_show
      description: '« Le pro n''est pas venu » : après la fin du créneau plus une
        marge. Rejoué : 200.'
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - bookings
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientBooking'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: no_show_too_early, transition_not_allowed
        '401':
          description: not_authenticated
        '403':
          description: profile_incomplete, role_required, provider_not_verified
        '404':
          description: not_found
  /api/catalog/trades/:
    get:
      operationId: catalog_trades_list
      description: Métiers actifs, par ``position`` (spec 002).
      tags:
      - catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TradeSummary'
          description: ''
  /api/catalog/trades/{slug}/:
    get:
      operationId: catalog_trade_retrieve
      description: Un métier, ses services actifs et les zones où il est ouvert (pages
        SEO).
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeDetail'
          description: ''
        '404':
          description: trade_not_found
  /api/health/:
    get:
      operationId: health
      description: 'Sonde de disponibilité : l''API répond et la base est joignable.'
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/me/:
    get:
      operationId: me_retrieve
      description: Profil du compte. Une session restreinte lit un profil minimal
        mais ne modifie rien.
      tags:
      - me
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: me_update
      description: Profil du compte. Une session restreinte lit un profil minimal
        mais ne modifie rien.
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '400':
          description: display_name_length, display_name_invalid, display_name_reserved
        '403':
          description: session_restricted
  /api/me/deletion/:
    post:
      operationId: me_deletion
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeletionConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeletionConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeletionConfirmRequest'
        required: true
      responses:
        '204':
          description: No response body
        '400':
          description: otp_invalid (+ attempts_remaining), otp_expired, otp_challenge_invalid
        '403':
          description: session_restricted, account_disabled
        '409':
          description: account_deletion_blocked (+ reasons), otp_already_used
        '429':
          description: otp_locked
  /api/me/deletion/otp/:
    post:
      operationId: me_deletion_otp
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: 'Une clé par saisie du numéro (16 à 64 caractères) : même clé,
          même réponse.'
        required: true
      tags:
      - me
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallengeResponse'
          description: ''
        '400':
          description: idempotency_key_required
        '403':
          description: session_restricted, account_disabled
        '409':
          description: account_deletion_blocked (+ reasons)
        '429':
          description: otp_rate_limited (+ retry_after)
        '503':
          description: otp_temporarily_unavailable
  /api/me/fresh-start/:
    post:
      operationId: me_fresh_start
      description: 'Session restreinte (compte dormant, client) : « Repartir de zéro
        ».'
      tags:
      - me
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
          description: ''
        '403':
          description: fresh_start_not_allowed, reauth_required, account_disabled
        '409':
          description: account_deletion_blocked (+ reasons)
  /api/me/invitations/:
    get:
      operationId: me_invitations_list
      description: Invitations en attente pour le numéro du compte (S19).
      parameters:
      - name: cursor
        required: false
        in: query
        description: La valeur du curseur de pagination.
        schema:
          type: string
      tags:
      - me
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInvitationList'
          description: ''
  /api/me/invitations/{public_id}/accept/:
    post:
      operationId: me_invitations_accept
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '204':
          description: 'Acceptée (rejouer une acceptation faite : 204)'
        '400':
          description: display_name_length, display_name_reserved…
        '403':
          description: profile_incomplete, role_not_allowed
        '404':
          description: not_found (autre numéro, close ou expirée)
        '503':
          description: invitation_unavailable
  /api/me/invitations/{public_id}/decline/:
    post:
      operationId: me_invitations_decline
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - me
      responses:
        '204':
          description: No response body
        '404':
          description: not_found
  /api/me/sessions/:
    get:
      operationId: me_sessions_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: La valeur du curseur de pagination.
        schema:
          type: string
      tags:
      - me
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDeviceSessionList'
          description: ''
  /api/me/sessions/{public_id}/:
    delete:
      operationId: me_sessions_revoke
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - me
      responses:
        '204':
          description: No response body
  /api/me/sessions/revoke-others/:
    post:
      operationId: me_sessions_revoke_others
      tags:
      - me
      responses:
        '204':
          description: No response body
  /api/ops/accounts/{public_id}/:
    get:
      operationId: ops_accounts_retrieve
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ops-accounts
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsAccountDetail'
          description: ''
        '400':
          description: reason_invalid, note_invalid
        '409':
          description: account_already_inactive, account_already_active, otp_not_blocked,
            account_not_dormant
        '403':
          description: ops_forbidden, ops_step_up_required, ops_target_forbidden,
            ops_admin_required
        '429':
          description: ops_rate_limited (+ retry_after)
        '404':
          description: not_found
  /api/ops/accounts/{public_id}/clear-dormant/:
    post:
      operationId: ops_accounts_clear_dormant
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ops-accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpsClearDormantRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OpsClearDormantRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OpsClearDormantRequestRequest'
        required: true
      responses:
        '204':
          description: No response body
        '400':
          description: reason_invalid, note_invalid
        '409':
          description: account_already_inactive, account_already_active, otp_not_blocked,
            account_not_dormant
        '403':
          description: ops_forbidden, ops_step_up_required, ops_target_forbidden,
            ops_admin_required
        '429':
          description: ops_rate_limited (+ retry_after)
        '404':
          description: not_found
  /api/ops/accounts/{public_id}/deactivate/:
    post:
      operationId: ops_accounts_deactivate
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ops-accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpsDeactivateRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OpsDeactivateRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OpsDeactivateRequestRequest'
        required: true
      responses:
        '204':
          description: No response body
        '400':
          description: reason_invalid, note_invalid
        '409':
          description: account_already_inactive, account_already_active, otp_not_blocked,
            account_not_dormant
        '403':
          description: ops_forbidden, ops_step_up_required, ops_target_forbidden,
            ops_admin_required
        '429':
          description: ops_rate_limited (+ retry_after)
        '404':
          description: not_found
  /api/ops/accounts/{public_id}/phone-change/:
    post:
      operationId: ops_accounts_phone_change
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ops-accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneChangeCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PhoneChangeCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhoneChangeCreateRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneChangeRequest'
          description: ''
        '400':
          description: phone_invalid, phone_unchanged, reason_invalid, note_invalid
        '403':
          description: ops_forbidden, ops_step_up_required, ops_target_forbidden,
            ops_second_operator_required
        '404':
          description: not_found
        '409':
          description: phone_in_use, phone_change_in_progress, account_disabled
        '429':
          description: otp_rate_limited, phone_change_codes_exhausted
  /api/ops/accounts/{public_id}/reactivate/:
    post:
      operationId: ops_accounts_reactivate
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ops-accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpsReactivateRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OpsReactivateRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OpsReactivateRequestRequest'
        required: true
      responses:
        '204':
          description: No response body
        '400':
          description: reason_invalid, note_invalid
        '409':
          description: account_already_inactive, account_already_active, otp_not_blocked,
            account_not_dormant
        '403':
