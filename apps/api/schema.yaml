openapi: 3.0.3
info:
  title: Jeflink API
  version: 0.1.0
  description: Contrat unique des fronts et apps Jeflink (client TS généré depuis
    ce schéma).
paths:
  /api/auth/config/:
    get:
      operationId: auth_config
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfig'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout
      tags:
      - auth
      responses:
        '204':
          description: No response body
  /api/auth/mfa/totp/confirm/:
    post:
      operationId: auth_mfa_totp_confirm
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCodeRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TotpCodeRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TotpCodeRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
          description: ''
        '400':
          description: mfa_invalid (+ attempts_remaining)
        '401':
          description: mfa_token_invalid
        '403':
          description: mfa_locked, mfa_enrollment_not_authorized
  /api/auth/mfa/totp/setup/:
    post:
      operationId: auth_mfa_totp_setup
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpSetupRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TotpSetupRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TotpSetupRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetupResponse'
          description: ''
        '400':
          description: mfa_invalid (+ attempts_remaining)
        '401':
          description: mfa_token_invalid
        '403':
          description: mfa_locked, mfa_enrollment_not_authorized
  /api/auth/mfa/totp/step-up/:
    post:
      operationId: auth_mfa_totp_step_up
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StepUpRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StepUpRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
        '400':
          description: mfa_invalid
        '403':
          description: ops_forbidden, mfa_locked
  /api/auth/mfa/totp/verify/:
    post:
      operationId: auth_mfa_totp_verify
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCodeRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TotpCodeRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TotpCodeRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
          description: ''
        '400':
          description: mfa_invalid (+ attempts_remaining)
        '401':
          description: mfa_token_invalid
        '403':
          description: mfa_locked, mfa_enrollment_not_authorized
  /api/auth/otp/request/:
    post:
      operationId: auth_otp_request
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: 'Une clé par saisie du numéro (16 à 64 caractères) : même clé,
          même réponse.'
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallengeResponse'
          description: ''
        '400':
          description: phone_invalid, phone_not_mobile, phone_region_not_supported
        '429':
          description: otp_rate_limited (+ retry_after)
        '503':
          description: otp_temporarily_unavailable
  /api/auth/otp/resend/:
    post:
      operationId: auth_otp_resend
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpResendRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpResendRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpResendRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallengeResponse'
          description: ''
  /api/auth/otp/verify/:
    post:
      operationId: auth_otp_verify
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
          description: ''
        '400':
          description: otp_invalid (+ attempts_remaining), otp_expired, otp_challenge_invalid,
            terms_not_accepted
        '403':
          description: account_disabled, account_not_allowed
        '409':
          description: otp_already_used
        '429':
          description: otp_locked
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '401':
          description: refresh_invalid, session_revoked
  /api/health/:
    get:
      operationId: health
      description: 'Sonde de disponibilité : l''API répond et la base est joignable.'
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/me/:
    get:
      operationId: me_retrieve
      description: Profil du compte. Une session restreinte lit un profil minimal
        mais ne modifie rien.
      tags:
      - me
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    patch:
      operationId: me_update
      description: Profil du compte. Une session restreinte lit un profil minimal
        mais ne modifie rien.
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '400':
          description: display_name_length, display_name_invalid, display_name_reserved
        '403':
          description: session_restricted
  /api/me/deletion/:
    post:
      operationId: me_deletion
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeletionConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeletionConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeletionConfirmRequest'
        required: true
      responses:
        '204':
          description: No response body
        '400':
          description: otp_invalid (+ attempts_remaining), otp_expired, otp_challenge_invalid
        '403':
          description: session_restricted, account_disabled
        '409':
          description: account_deletion_blocked (+ reasons), otp_already_used
        '429':
          description: otp_locked
  /api/me/deletion/otp/:
    post:
      operationId: me_deletion_otp
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: 'Une clé par saisie du numéro (16 à 64 caractères) : même clé,
          même réponse.'
        required: true
      tags:
      - me
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallengeResponse'
          description: ''
        '400':
          description: idempotency_key_required
        '403':
          description: session_restricted, account_disabled
        '409':
          description: account_deletion_blocked (+ reasons)
        '429':
          description: otp_rate_limited (+ retry_after)
        '503':
          description: otp_temporarily_unavailable
  /api/me/fresh-start/:
    post:
      operationId: me_fresh_start
      description: 'Session restreinte (compte dormant, client) : « Repartir de zéro
        ».'
      tags:
      - me
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
          description: ''
        '403':
          description: fresh_start_not_allowed, reauth_required, account_disabled
        '409':
          description: account_deletion_blocked (+ reasons)
  /api/me/invitations/:
    get:
      operationId: me_invitations_list
      description: Invitations en attente pour le numéro du compte (S19).
      parameters:
      - name: cursor
        required: false
        in: query
        description: La valeur du curseur de pagination.
        schema:
          type: string
      tags:
      - me
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInvitationList'
          description: ''
  /api/me/invitations/{public_id}/accept/:
    post:
      operationId: me_invitations_accept
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - me
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '204':
          description: 'Acceptée (rejouer une acceptation faite : 204)'
        '400':
          description: display_name_length, display_name_reserved…
        '403':
          description: profile_incomplete, role_not_allowed
        '404':
          description: not_found (autre numéro, close ou expirée)
        '503':
          description: invitation_unavailable
  /api/me/invitations/{public_id}/decline/:
    post:
      operationId: me_invitations_decline
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - me
      responses:
        '204':
          description: No response body
        '404':
          description: not_found
  /api/me/sessions/:
    get:
      operationId: me_sessions_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: La valeur du curseur de pagination.
        schema:
          type: string
      tags:
      - me
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDeviceSessionList'
          description: ''
  /api/me/sessions/{public_id}/:
    delete:
      operationId: me_sessions_revoke
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - me
      responses:
        '204':
          description: No response body
  /api/me/sessions/revoke-others/:
    post:
      operationId: me_sessions_revoke_others
      tags:
      - me
      responses:
        '204':
          description: No response body
  /api/ops/accounts/{public_id}/:
    get:
      operationId: ops_accounts_retrieve
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ops-accounts
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsAccountDetail'
          description: ''
        '400':
          description: reason_invalid, note_invalid
        '409':
          description: account_already_inactive, account_already_active, otp_not_blocked,
            account_not_dormant
        '403':
          description: ops_forbidden, ops_step_up_required, ops_target_forbidden
        '404':
          description: not_found
  /api/ops/accounts/{public_id}/clear-dormant/:
    post:
      operationId: ops_accounts_clear_dormant
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ops-accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpsClearDormantRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OpsClearDormantRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OpsClearDormantRequestRequest'
        required: true
      responses:
        '204':
          description: No response body
        '400':
          description: reason_invalid, note_invalid
        '409':
          description: account_already_inactive, account_already_active, otp_not_blocked,
            account_not_dormant
        '403':
          description: ops_forbidden, ops_step_up_required, ops_target_forbidden
        '404':
          description: not_found
  /api/ops/accounts/{public_id}/deactivate/:
    post:
      operationId: ops_accounts_deactivate
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ops-accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpsDeactivateRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OpsDeactivateRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OpsDeactivateRequestRequest'
        required: true
      responses:
        '204':
          description: No response body
        '400':
          description: reason_invalid, note_invalid
        '409':
          description: account_already_inactive, account_already_active, otp_not_blocked,
            account_not_dormant
        '403':
          description: ops_forbidden, ops_step_up_required, ops_target_forbidden
        '404':
          description: not_found
  /api/ops/accounts/{public_id}/reactivate/:
    post:
      operationId: ops_accounts_reactivate
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ops-accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpsReactivateRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OpsReactivateRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OpsReactivateRequestRequest'
        required: true
      responses:
        '204':
          description: No response body
        '400':
          description: reason_invalid, note_invalid
        '409':
          description: account_already_inactive, account_already_active, otp_not_blocked,
            account_not_dormant
        '403':
          description: ops_forbidden, ops_step_up_required, ops_target_forbidden
        '404':
          description: not_found
  /api/ops/accounts/{public_id}/reveal-phone/:
    post:
      operationId: ops_accounts_reveal_phone
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ops-accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpsRevealPhoneRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OpsRevealPhoneRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OpsRevealPhoneRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevealedPhone'
          description: ''
        '400':
          description: reason_invalid, note_invalid
        '409':
          description: account_already_inactive, account_already_active, otp_not_blocked,
            account_not_dormant
        '403':
          description: ops_forbidden, ops_step_up_required, ops_target_forbidden
        '404':
          description: not_found
  /api/ops/accounts/{public_id}/revoke-sessions/:
    post:
      operationId: ops_accounts_revoke_sessions
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ops-accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpsRevokeSessionsRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OpsRevokeSessionsRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OpsRevokeSessionsRequestRequest'
        required: true
      responses:
        '204':
          description: No response body
        '400':
          description: reason_invalid, note_invalid
        '409':
          description: account_already_inactive, account_already_active, otp_not_blocked,
            account_not_dormant
        '403':
          description: ops_forbidden, ops_step_up_required, ops_target_forbidden
        '404':
          description: not_found
  /api/ops/accounts/{public_id}/unblock-otp/:
    post:
      operationId: ops_accounts_unblock_otp
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ops-accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpsUnblockOtpRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OpsUnblockOtpRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OpsUnblockOtpRequestRequest'
        required: true
      responses:
        '204':
          description: No response body
        '400':
          description: reason_invalid, note_invalid
        '409':
          description: account_already_inactive, account_already_active, otp_not_blocked,
            account_not_dormant
        '403':
          description: ops_forbidden, ops_step_up_required, ops_target_forbidden
        '404':
          description: not_found
  /api/ops/accounts/search/:
    post:
      operationId: ops_accounts_search
      tags:
      - ops-accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpsSearchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OpsSearchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OpsSearchRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsSearchResult'
          description: ''
        '400':
          description: phone_invalid
components:
  schemas:
    AcceptInvitationRequest:
      type: object
      properties:
        display_name:
          type: string
          default: ''
          maxLength: 256
    AccessToken:
      type: object
      properties:
        access:
          type: string
        access_expires_at:
          type: string
          format: date-time
      required:
      - access
      - access_expires_at
    AppD8cEnum:
      enum:
      - client
      - pro
      type: string
      description: |-
        * `client` - client
        * `pro` - pro
    AuthConfig:
      type: object
      properties:
        regions:
          type: array
          items:
            $ref: '#/components/schemas/Region'
        code_length:
          type: integer
        client_challenge_required:
          type: boolean
        terms_version:
          type: string
      required:
      - client_challenge_required
      - code_length
      - regions
      - terms_version
    AuthUser:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
        phone_display:
          type: string
        display_name:
          type: string
        profile_status:
          type: string
        preferred_language:
          type: string
        roles:
          type: array
          items:
            type: string
      required:
      - display_name
      - phone_display
      - preferred_language
      - profile_status
      - public_id
      - roles
    DeletionConfirmRequest:
      type: object
      properties:
        challenge_id:
          type: string
          format: uuid
        challenge_secret:
          type: string
          minLength: 1
          maxLength: 64
        code:
          type: string
          minLength: 1
          pattern: ^[0-9]{6}$
      required:
      - challenge_id
      - challenge_secret
      - code
    DevicePlatformEnum:
      enum:
      - android
      - ios
      - web
      type: string
      description: |-
        * `android` - android
        * `ios` - ios
        * `web` - web
    DeviceRequest:
      type: object
      properties:
        platform:
          $ref: '#/components/schemas/DevicePlatformEnum'
        label:
          type: string
          default: ''
          maxLength: 120
        install_id:
          type: string
          default: ''
          maxLength: 64
      required:
      - platform
    DeviceSession:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        app:
          allOf:
          - $ref: '#/components/schemas/DeviceSessionAppEnum'
          readOnly: true
        platform:
          allOf:
          - $ref: '#/components/schemas/DeviceSessionPlatformEnum'
          readOnly: true
        device_label:
          type: string
          readOnly: true
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        is_current:
          type: boolean
          readOnly: true
      required:
      - app
      - created_at
      - device_label
      - is_current
      - last_seen_at
      - platform
      - public_id
