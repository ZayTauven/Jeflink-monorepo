openapi: 3.0.3
info:
  title: API Jeflink
  version: 0.1.0
  description: 'Démo locale : comptes, métiers, quartiers, demandes, devis et avis.'
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/pros/:
    get:
      operationId: pros_list
      parameters:
      - in: query
        name: trade
        schema:
          type: string
        description: slug du métier
      - in: query
        name: zone
        schema:
          type: string
        description: slug du quartier
      tags:
      - pros
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicPro'
          description: ''
  /api/pros/{id}/:
    get:
      operationId: pros_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - pros
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPro'
          description: ''
  /api/requests/:
    get:
      operationId: requests_list
      description: Demandes. Un client voit les siennes ; un pro voit celles de ses
        métiers et ses missions.
      parameters:
      - in: query
        name: scope
        schema:
          type: string
          enum:
          - mine
          - open
        description: pros uniquement
      - in: query
        name: status
        schema:
          type: string
          enum:
          - booked
          - cancelled
          - done
          - open
      tags:
      - requests
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Request'
          description: ''
    post:
      operationId: requests_create
      description: Demandes. Un client voit les siennes ; un pro voit celles de ses
        métiers et ses missions.
      tags:
      - requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RequestCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RequestCreate'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
          description: ''
  /api/requests/{id}/:
    get:
      operationId: requests_retrieve
      description: Demandes. Un client voit les siennes ; un pro voit celles de ses
        métiers et ses missions.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) demande.
        required: true
      tags:
      - requests
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
          description: ''
  /api/requests/{id}/accept/:
    post:
      operationId: requests_accept_create
      description: Demandes. Un client voit les siennes ; un pro voit celles de ses
        métiers et ses missions.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) demande.
        required: true
      tags:
      - requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Accept'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Accept'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Accept'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
          description: ''
  /api/requests/{id}/cancel/:
    post:
      operationId: requests_cancel_create
      description: Demandes. Un client voit les siennes ; un pro voit celles de ses
        métiers et ses missions.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) demande.
        required: true
      tags:
      - requests
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
          description: ''
  /api/requests/{id}/complete/:
    post:
      operationId: requests_complete_create
      description: Demandes. Un client voit les siennes ; un pro voit celles de ses
        métiers et ses missions.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) demande.
        required: true
      tags:
      - requests
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Request'
          description: ''
  /api/requests/{id}/quotes/:
    post:
      operationId: requests_quotes_create
      description: Demandes. Un client voit les siennes ; un pro voit celles de ses
        métiers et ses missions.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) demande.
        required: true
      tags:
      - requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QuoteCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuoteCreate'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
          description: ''
  /api/requests/{id}/review/:
    post:
      operationId: requests_review_create
      description: Demandes. Un client voit les siennes ; un pro voit celles de ses
        métiers et ses missions.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) demande.
        required: true
      tags:
      - requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReviewCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReviewCreate'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/stats/:
    get:
      operationId: stats_retrieve
      tags:
      - stats
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
          description: ''
  /api/trades/:
    get:
      operationId: trades_list
      tags:
      - trades
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trade'
          description: ''
  /api/trades/{slug}/:
    get:
      operationId: trades_retrieve
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - trades
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trade'
          description: ''
  /api/zones/:
    get:
      operationId: zones_list
      tags:
      - zones
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Zone'
          description: ''
components:
  schemas:
    Accept:
      type: object
      properties:
        quote_id:
          type: integer
      required:
      - quote_id
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/Me'
      required:
      - token
      - user
    Event:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/RequestStatusEnum'
        status_label:
          type: string
          readOnly: true
        note:
          type: string
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - status
      - status_label
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    Me:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          title: Prénom
          maxLength: 150
        last_name:
          type: string
          title: Nom
          maxLength: 150
        phone:
          title: Téléphone
          oneOf:
          - type: string
            pattern: ^\+221\d{9}$
            maxLength: 13
          - type: string
            maxLength: 0
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          title: Rôle
        is_staff:
          type: boolean
          title: Statut équipe
          description: Précise si l’utilisateur peut se connecter à ce site d'administration.
        pro_profile:
          allOf:
          - $ref: '#/components/schemas/ProProfile'
          readOnly: true
      required:
      - email
      - id
      - pro_profile
    Person:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    ProProfile:
      type: object
      properties:
        headline:
          type: string
          title: Accroche
          maxLength: 120
        bio:
          type: string
          title: Présentation
        trades:
          type: array
          items:
            type: string
          readOnly: true
        zones:
          type: array
          items:
            type: string
          readOnly: true
        years_experience:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          title: Années d'expérience
        is_verified:
          type: boolean
          title: Vérifié
          description: Seuls les pros vérifiés par l'équipe Jeflink peuvent envoyer
            des devis.
        photo:
          type: string
          description: Chemin d'image servi par le site web.
          maxLength: 200
      required:
      - trades
      - zones
    PublicPro:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        headline:
          type: string
          title: Accroche
          maxLength: 120
        bio:
          type: string
          title: Présentation
        photo:
          type: string
          description: Chemin d'image servi par le site web.
          maxLength: 200
        years_experience:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          title: Années d'expérience
        trades:
          type: array
          items:
            $ref: '#/components/schemas/TradeRef'
          readOnly: true
        zones:
          type: array
          items:
            $ref: '#/components/schemas/Zone'
          readOnly: true
        rating:
          type: object
          additionalProperties: {}
          readOnly: true
        missions_done:
          type: integer
          readOnly: true
      required:
      - id
      - missions_done
      - name
      - rating
      - trades
      - zones
    Quote:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        pro:
          allOf:
          - $ref: '#/components/schemas/Person'
          readOnly: true
        pro_headline:
          type: string
          readOnly: true
        pro_rating:
          type: object
          additionalProperties: {}
          readOnly: true
        amount:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          title: Montant (F CFA)
        message:
          type: string
        status:
          $ref: '#/components/schemas/QuoteStatusEnum'
        status_label:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - created_at
      - id
      - pro
      - pro_headline
      - pro_rating
      - status_label
    QuoteCreate:
      type: object
      properties:
        amount:
          type: integer
          maximum: 10000000
          minimum: 1
        message:
          type: string
          maxLength: 1000
      required:
      - amount
    QuoteStatusEnum:
      enum:
      - pending
      - accepted
      - declined
      type: string
      description: |-
        * `pending` - En attente
        * `accepted` - Accepté
        * `declined` - Non retenu
    Register:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
          minLength: 8
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        phone:
          type: string
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          default: client
        trades:
          type: array
          items:
            type: string
        zones:
          type: array
          items:
            type: string
        headline:
          type: string
          maxLength: 120
      required:
      - email
      - first_name
      - password
    Request:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          title: Titre
          maxLength: 120
        description:
          type: string
        landmark:
          type: string
          title: Repère
          maxLength: 160
        preferred_date:
          type: string
          format: date
          nullable: true
          title: Date souhaitée
        is_urgent:
          type: boolean
          title: Urgent
        status:
          $ref: '#/components/schemas/RequestStatusEnum'
        status_label:
          type: string
          readOnly: true
        trade:
          type: object
          additionalProperties: {}
          readOnly: true
        zone:
          type: object
          additionalProperties: {}
          readOnly: true
        client:
          allOf:
          - $ref: '#/components/schemas/Person'
          readOnly: true
        pro:
          allOf:
          - $ref: '#/components/schemas/Person'
          readOnly: true
          nullable: true
        contact_phone:
          type: string
          nullable: true
          description: Le numéro de l'autre partie n'apparaît qu'une fois la mission
            réservée.
          readOnly: true
        quotes:
          type: array
          items: {}
          readOnly: true
        quotes_count:
          type: integer
          readOnly: true
        review:
          allOf:
          - $ref: '#/components/schemas/Review'
          readOnly: true
          nullable: true
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
          readOnly: true
        actions:
          type: array
          items:
            type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actions
      - client
      - contact_phone
      - created_at
      - description
      - events
      - id
      - pro
      - quotes
      - quotes_count
      - review
      - status_label
      - title
      - trade
      - zone
    RequestCreate:
      type: object
      properties:
        trade:
          type: string
        zone:
          type: string
        title:
          type: string
          title: Titre
          maxLength: 120
        description:
          type: string
        landmark:
          type: string
          title: Repère
          maxLength: 160
        preferred_date:
          type: string
          format: date
          nullable: true
          title: Date souhaitée
        is_urgent:
          type: boolean
          title: Urgent
      required:
      - description
      - title
      - trade
      - zone
    RequestStatusEnum:
      enum:
      - open
      - booked
      - done
      - cancelled
      type: string
      description: |-
        * `open` - En attente de devis
        * `booked` - Pro réservé
        * `done` - Terminée
        * `cancelled` - Annulée
    Review:
      type: object
      properties:
        rating:
          type: integer
          maximum: 5
          minimum: 1
          title: Note
        comment:
          type: string
          title: Commentaire
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - rating
    ReviewCreate:
      type: object
      properties:
        rating:
          type: integer
          maximum: 5
          minimum: 1
        comment:
          type: string
          maxLength: 1000
      required:
      - rating
    RoleEnum:
      enum:
      - client
      - pro
      type: string
      description: |-
        * `client` - Client
        * `pro` - Pro
    Stats:
      type: object
      properties:
        pros:
          type: integer
        trades:
          type: integer
        zones:
          type: integer
        missions_done:
          type: integer
        average_rating:
          type: number
          format: double
          nullable: true
      required:
      - average_rating
      - missions_done
      - pros
      - trades
      - zones
    Trade:
      type: object
      properties:
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          title: Nom
          maxLength: 80
        tagline:
          type: string
          title: Résumé
          maxLength: 180
        description:
          type: string
        services:
          title: Prestations courantes
          description: 'Liste JSON : ["Fuite", …]'
        starting_price:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
          title: À partir de (F CFA)
          description: Entier en F CFA, sans décimales.
        icon:
          type: string
          title: Icône
          description: Classe Bootstrap Icons, ex. bi-droplet
          maxLength: 40
        image:
          type: string
          description: Chemin d'image servi par le site web.
          maxLength: 200
        pros_count:
          type: integer
          readOnly: true
      required:
      - name
      - pros_count
      - slug
    TradeRef:
      type: object
      properties:
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          title: Nom
          maxLength: 80
        icon:
          type: string
          title: Icône
          description: Classe Bootstrap Icons, ex. bi-droplet
          maxLength: 40
      required:
      - name
      - slug
    Zone:
      type: object
      properties:
        slug:
          type: string
          maxLength: 50
