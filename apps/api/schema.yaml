            application/json:
              schema:
                $ref: '#/components/schemas/ClientRequest'
          description: ''
        '401':
          description: not_authenticated
        '403':
          description: profile_incomplete, role_required, provider_not_verified
        '404':
          description: not_found
  /api/requests/{public_id}/cancel/:
    post:
      operationId: requests_cancel
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRequest'
          description: ''
        '409':
          description: 'request_closed (réservée : annuler la réservation)'
        '422':
          description: reason_invalid, note_invalid
        '401':
          description: not_authenticated
        '403':
          description: profile_incomplete, role_required, provider_not_verified
        '404':
          description: not_found
  /api/zones/:
    get:
      operationId: zones_list
      description: Zones actives de villes actives, par popularité puis nom (spec
        002).
      parameters:
      - in: query
        name: city
        schema:
          type: string
        description: Slug de la ville (ex. dakar).
      tags:
      - zones
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Zone'
          description: ''
  /api/zones/{slug}/trades/:
    get:
      operationId: zone_trades_list
      description: Métiers ouverts dans une zone, sous la même forme que la liste
        des métiers.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - zones
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TradeSummary'
          description: ''
        '404':
          description: zone_not_found
