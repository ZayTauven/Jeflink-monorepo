[project]
name = "jeflink-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "anthropic>=1.13.0",
  "django>=5.2.7,<5.3",
  "djangorestframework>=3.16",
  "drf-spectacular>=0.28",
  "pillow>=12.3.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-django>=4.10",
  "ruff>=0.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "jeflink.settings"
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ", "SIM"]
ignore = ["DJ001"]
